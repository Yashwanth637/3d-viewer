<svg id="logo" viewBox="0 0 295 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gmc_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="face_top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="face_left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="face_right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="line_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- 3D Isometric Geometric Emblem -->
  <g transform="translate(6, 4)">
    <!-- Outer Hexagon Frame -->
    <polygon points="26,2 48,15 48,39 26,52 4,39 4,15" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <!-- Top Face -->
    <polygon points="26,6 44,17 26,27 8,17" fill="url(#face_top)"/>
    <!-- Left Face -->
    <polygon points="8,17 26,27 26,47 8,37" fill="url(#face_left)"/>
    <!-- Right Face -->
    <polygon points="26,27 44,17 44,37 26,47" fill="url(#face_right)"/>
    <!-- Inner Accent Cube Core -->
    <polygon points="26,17 34,22 26,27 18,22" fill="#ffffff" opacity="0.9"/>
    <polygon points="18,22 26,27 26,37 18,32" fill="#38bdf8" opacity="0.95"/>
    <polygon points="26,27 34,22 34,32 26,37" fill="#0284c7" opacity="0.95"/>
  </g>
  <!-- Typography -->
  <text x="68" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="28" font-weight="900" fill="url(#gmc_grad)" letter-spacing="1">GMC</text>
  <text x="144" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="0.5">3D</text>
  <text x="186" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="19" font-weight="600" fill="#94a3b8" letter-spacing="2.5">VIEWER</text>
  <!-- Sleek Accent Line -->
  <rect x="144" y="44" width="138" height="2" rx="1" fill="url(#line_grad)"/>
</svg>
