<svg id="logo" viewBox="0 0 280 56" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="face_top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="face_left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="face_right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
  </defs>
  <!-- 3D Isometric Geometric Emblem -->
  <g transform="translate(4, 3)">
    <polygon points="25,2 47,15 47,39 25,51 3,39 3,15" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <polygon points="25,5 43,16 25,26 7,16" fill="url(#face_top)"/>
    <polygon points="7,16 25,26 25,46 7,36" fill="url(#face_left)"/>
    <polygon points="25,26 43,16 43,36 25,46" fill="url(#face_right)"/>
    <polygon points="25,16 33,21 25,26 17,21" fill="#ffffff" opacity="0.9"/>
    <polygon points="17,21 25,26 25,36 17,31" fill="#38bdf8" opacity="0.95"/>
    <polygon points="25,26 33,21 33,31 25,36" fill="#0284c7" opacity="0.95"/>
  </g>
  <!-- Typography: Theme-Aware -->
  <text x="58" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="27" font-weight="900" fill="#0284c7" letter-spacing="0.5">GMC</text>
  <text x="128" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="24" font-weight="800" style="fill:var(--ov_logo_text_color, #ffffff);" fill="#ffffff" letter-spacing="0.5">3D</text>
  <text x="170" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="18" font-weight="600" style="fill:var(--ov_logo_text_color, #94a3b8); opacity: 0.78;" fill="#94a3b8" letter-spacing="2">VIEWER</text>
  <rect x="128" y="43" width="144" height="2.5" rx="1" fill="#0284c7" opacity="0.85"/>
</svg>
