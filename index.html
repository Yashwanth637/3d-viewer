<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="content-type" content="text/html;charset=utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no">
    <link rel="icon" type="image/x-icon" href="assets/images/3dviewer_net_favicon.ico">

    <title>GMC 3D viewer</title>

    <meta name="description" content="GMC 3D viewer - A modern solution to visualize, section, and explore 3D models right in your browser. Supported formats: 3dm, 3ds, 3mf, amf, bim, brep, dae, fbx, fcstd, gltf, ifc, iges, step, stl, obj, off, ply, wrl.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="GMC 3D viewer">
    <meta property="og:description" content="GMC 3D viewer - A modern solution to visualize, section, and explore 3D models right in your browser.">

    <link rel="stylesheet" type="text/css" href="o3dv/o3dv.website.min.css">
    <link rel="stylesheet" type="text/css" href="css/custom_icons.css">
    <script type="text/javascript" src="o3dv/o3dv.website.min.js"></script>
    <script type="text/javascript" src="plugins/print3d.js"></script>
    <script type="text/javascript" src="plugins/sectionview.js"></script>

    <script type="text/javascript">
        OV.StartWebsite ();
    </script>
</head>

<body>
    <!-- Brand New Custom Logo Symbol: GMC 3D VIEWER -->
    <svg style="display:none;" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="gmc_grad_in" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#38bdf8"/>
                <stop offset="100%" stop-color="#2563eb"/>
            </linearGradient>
            <linearGradient id="face_top_in" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#67e8f9"/>
                <stop offset="100%" stop-color="#0ea5e9"/>
            </linearGradient>
            <linearGradient id="face_left_in" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#0284c7"/>
                <stop offset="100%" stop-color="#0369a1"/>
            </linearGradient>
            <linearGradient id="face_right_in" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#075985"/>
                <stop offset="100%" stop-color="#0c4a6e"/>
            </linearGradient>
            <linearGradient id="line_grad_in" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
                <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
            </linearGradient>
        </defs>
        <symbol id="logo" viewBox="0 0 295 60">
            <g transform="translate(6, 4)">
                <polygon points="26,2 48,15 48,39 26,52 4,39 4,15" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
                <polygon points="26,6 44,17 26,27 8,17" fill="url(#face_top_in)"/>
                <polygon points="8,17 26,27 26,47 8,37" fill="url(#face_left_in)"/>
                <polygon points="26,27 44,17 44,37 26,47" fill="url(#face_right_in)"/>
                <polygon points="26,17 34,22 26,27 18,22" fill="#ffffff" opacity="0.9"/>
                <polygon points="18,22 26,27 26,37 18,32" fill="#38bdf8" opacity="0.95"/>
                <polygon points="26,27 34,22 34,32 26,37" fill="#0284c7" opacity="0.95"/>
            </g>
            <text x="68" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="28" font-weight="900" fill="url(#gmc_grad_in)" letter-spacing="1">GMC</text>
            <text x="144" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="0.5">3D</text>
            <text x="186" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="19" font-weight="600" fill="#94a3b8" letter-spacing="2.5">VIEWER</text>
            <rect x="144" y="44" width="138" height="2" rx="1" fill="url(#line_grad_in)"/>
        </symbol>
    </svg>

    <input type="file" id="open_file" style="display:none;" multiple></input>
    <div class="header" id="header">
        <div class="title">
            <div class="title_left">
                <a href="index.html">
                    <svg class="logo_image"><use href="#logo"></use></svg>
                </a>
            </div>
            <div class="title_right" id="header_buttons"></div>
            <div class="main_file_name only_full_width" id="main_file_name"></div>
        </div>
        <div class="toolbar" id="toolbar"></div>
    </div>
    <div class="main" id="main">
        <div class="main_left_container only_full_width" id="main_left_container">
            <div class="main_navigator ov_panel_set_container" id="main_navigator"></div>
            <div class="main_splitter" id="main_navigator_splitter"></div>
        </div>
        <div class="main_viewer" id="main_viewer"></div>
        <div class="main_right_container only_full_width" id="main_right_container">
            <div class="main_splitter" id="main_sidebar_splitter"></div>
            <div class="main_sidebar ov_panel_set_right_container" id="main_sidebar"></div>
        </div>
    </div>
    <div class="intro ov_thin_scrollbar" id="intro">
        <div class="intro_content" id="intro_content">
            <div class="intro_logo">
                <svg class="intro_logo"><use href="#logo"></use></svg>
                <div class="intro_dragdrop_text" id="intro_dragdrop_text">Drag and drop 3D models here.</div>
            </div>
            <div class="intro_formats">
                <div class="intro_formats_title" id="intro_formats_title">Check an example file:</div>
                <div class="intro_file_formats">
                    <a href="#model=assets/models/RhinoLogo.3dm">3dm</a>
                    <a href="#model=assets/models/cubes.3ds,assets/models/texture.png">3ds</a>
                    <a href="#model=assets/models/rhombicuboctahedron.3mf">3mf</a>
                    <a href="#model=assets/models/rook.amf">amf</a>
                    <a href="#model=assets/models/MultipleMeshes.bim">bim</a>
                    <a href="#model=assets/models/as1_pe_203.brep">brep</a>
                    <a href="#model=assets/models/X_Bot.dae">dae</a>
                    <a href="#model=assets/models/Y_Bot.fbx">fbx</a>
                    <a href="#model=assets/models/ArchDetail.FCStd">fcstd</a>
                    <a href="#model=assets/models/DamagedHelmet.glb">gltf</a>
                    <a href="#model=assets/models/haus.ifc">ifc</a>
                    <a href="#model=assets/models/as1_pe_203.igs">iges</a>
                    <a href="#model=assets/models/as1_pe_203.stp">step</a>
                    <a href="#model=assets/models/utah_teapot.stl">stl</a>
                    <a href="#model=assets/models/solids.obj,assets/models/solids.mtl">obj</a>
                    <a href="#model=assets/models/cube.off">off</a>
                    <a href="#model=assets/models/cow.ply">ply</a>
                    <a href="#model=assets/models/extrusion3.wrl">wrl</a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
